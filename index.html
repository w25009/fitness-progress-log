<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Progress Log</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Fitness Progress Log</h1>
            <p>Track your daily workouts and lifting volume</p>
        </header>

        <!-- Total Volume Display Card -->
         <section class="summary-card">
            <h3>Total Volume</h3>
            <div class="volume-amount"><span id="total-volume">0</span> kg
            </div>
         </section>

         <!-- Workout entry form -->
          <section class="form-section">
            <h2>Add New Log</h2>
            <form id="workout-form">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="exercise">Exercise</label>
                    <input type="text" id="exercise" placeholder="e.g. Bench Press" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="weight">Weight</label>
                        <input type="number" id="weight" min="0" step="0.5" placeholder="60" required>
                    </div>
                    <div class="form-group">
                        <label for="reps">Reps</label>
                        <input type="number" id="reps" min="1" placeholder="10" required>
                    </div>
                    <div class="form-group">
                        <label for="sets">Sets</label>
                        <input type="number" id="sets" min="1" placeholder="3" required>
                    </div>
                </div>

                <button type="submit" id="submit-btn">Save Workout Log</button>
            </form>
          </section>

          <!-- Workout History Table -->
           <section class="list-section">
            <h2>Workout History</h2>
            <div class="table-container">
                <table class="log-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Exercise</th>
                        <th>Weight</th>
                        <th>Reps</th>
                        <th>Sets</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="log-list">

                </tbody>
            </table>
            </div>
           </section>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
